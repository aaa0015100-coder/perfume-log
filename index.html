/* App 樣式 v1（源自抗生素選擇助手 v0.6）。配色只換 accent 相關 token；perfume-log 用木頭／咖啡色系 */
:root{
  --bg:#f1ece6; --surface:#fffdfa; --surface2:#f7f2ec; --ink:#231a14; --muted:#6a5a4e; --line:#ddd2c6;
  --accent:#6b4428; --accent-ink:#ffffff; --accent-weak:#f0e4d7;
  --warn:#8f5400; --warn-bg:#fcefd8; --danger:#ae2a20; --danger-bg:#fae4e1;
  --ok:#1d7344; --ok-bg:#def2e6; --info:#2a5a86; --info-bg:#e3edf7;
  --f-body:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,Consolas,monospace;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6; --c0:#8a8178;
  --c1-ink:#ffffff; --c2-ink:#1a120c; --c3-ink:#1a120c; --c4-ink:#1a120c; --c5-ink:#1a120c; --c6-ink:#ffffff; --c0-ink:#1a120c;
  --h1:#c8a27c; --h2:#9a6b45; --h3:#6b4428;
  --s3:#1d6b45; --s3-ink:#ffffff; --s2:#9ccf72; --s2-ink:#14301c; --s1:#f0c64a; --s1-ink:#3a2c00; --s0:#d9534f; --s0-ink:#ffffff;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14100d; --surface:#1d1814; --surface2:#241e19; --ink:#ece3da; --muted:#a8998b; --line:#3a3029;
  --accent:#d2a57c; --accent-ink:#22160c; --accent-weak:#3a2a1c;
  --warn:#f2b45c; --warn-bg:#382810; --danger:#ff8b80; --danger-bg:#3b1a17;
  --ok:#6fd39a; --ok-bg:#142e1e; --info:#93bde6; --info-bg:#16283a; color-scheme:dark;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c0:#7d746b;
  --c1-ink:#14100d; --c2-ink:#14100d; --c3-ink:#14100d; --c4-ink:#14100d; --c5-ink:#14100d; --c6-ink:#14100d; --c0-ink:#14100d;
  --h1:#6a4b30; --h2:#9f7552; --h3:#d9b089;}}
:root[data-theme="dark"]{
  --bg:#14100d; --surface:#1d1814; --surface2:#241e19; --ink:#ece3da; --muted:#a8998b; --line:#3a3029;
  --accent:#d2a57c; --accent-ink:#22160c; --accent-weak:#3a2a1c;
  --warn:#f2b45c; --warn-bg:#382810; --danger:#ff8b80; --danger-bg:#3b1a17;
  --ok:#6fd39a; --ok-bg:#142e1e; --info:#93bde6; --info-bg:#16283a; color-scheme:dark;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c0:#7d746b;
  --c1-ink:#14100d; --c2-ink:#14100d; --c3-ink:#14100d; --c4-ink:#14100d; --c5-ink:#14100d; --c6-ink:#14100d; --c0-ink:#14100d;
  --h1:#6a4b30; --h2:#9f7552; --h3:#d9b089;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.brand .sub{color:var(--muted);font-size:.85rem}
.ver{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.disc{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:9px 14px;font-size:.86rem;margin-bottom:16px}
.disc b{font-weight:600}

.cols{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:14px}
@media (max-width:920px){.side{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:.8rem;color:var(--muted)}
.field input:not([type=radio]):not([type=checkbox]),.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;font-family:var(--f-mono);font-size:.95rem}
.field select{font-family:var(--f-body)}
.unit{font-size:.75rem;color:var(--muted)}

const APP_VERSION = "1.2";

/* ===== 小工具 ===== */
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function uid(){ try{ if(typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10); }
function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function fmtNum(n){ return (Math.round(n*100)/100).toString(); }
function money(n){ return "NT$ " + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function norm(s){ return String(s == null ? "" : s).normalize("NFKC").toLowerCase(); }
function str(v, max){
  if(v == null) return "";
  if(typeof v === "number" && isFinite(v)) v = String(v);
  if(typeof v !== "string") return "";
  return v.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,"").trim().slice(0, max || 200);
}
function num(v, min, max, int){
  if(v === "" || v == null || typeof v === "boolean") return null;
  const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[,，\s]/g,""));
  if(!isFinite(n) || n < min || n > max) return null;
  return int ? Math.round(n) : Math.round(n*100)/100;
}
function pick(v, list){ return keysOf(list).includes(v) ? v : ""; }
function pickArr(v, list, max){
  if(!Array.isArray(v)) return [];
  const ok = keysOf(list), out = [];
  v.forEach(x => { if(ok.includes(x) && !out.includes(x)) out.push(x); });
  return max ? out.slice(0, max) : out;
}
function tagArr(v){
  if(!Array.isArray(v)) return [];
  const out = [], seen = new Set();
  v.forEach(x => { const t = str(x, 40), k = norm(t); if(t && !seen.has(k)){ seen.add(k); out.push(t); } });
  return out.slice(0, 40);
}
function isDate(s){ return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + "T00:00:00").getTime()); }
function toggleArr(arr, v){ const i = arr.indexOf(v); if(i >= 0) arr.splice(i,1); else arr.push(v); }
function splitList(v){ return String(v).split(/[、,，;；\/|｜]+/).map(s => s.trim()).filter(Boolean); }

/* ===== 資料模型 ===== */
function normalizeItem(raw){
  const r = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
  const n = r.notes && typeof r.notes === "object" && !Array.isArray(r.notes) ? r.notes : {};
  const now = Date.now();
  const it = {
    id: typeof r.id === "string" && r.id && r.id.length <= 64 ? r.id : uid(),
    created: num(r.created, 1, 9e15, true) || now,
    updated: num(r.updated, 1, 9e15, true) || now,
    brand: str(r.brand, 80),
    name: str(r.name, 120),
    status: pick(r.status, STATUS) || "own",
    conc: pick(r.conc, CONC),
    families: pickArr(r.families, FAMS, 2),
    perfumer: str(r.perfumer, 120),
    year: num(r.year, 1700, 2100, true),
    volume: num(r.volume, 0.1, 10000),
    level: pick(r.level, LEVELS),
    buyDate: isDate(r.buyDate) ? r.buyDate : "",
    buyPlace: str(r.buyPlace, 120),
    price: num(r.price, 0, 100000000),
    seasons: pickArr(r.seasons, SEASONS),
    times: pickArr(r.times, TIMES),
    notesLayered: r.notesLayered !== false,
    notes: { top: tagArr(n.top), mid: tagArr(n.mid), base: tagArr(n.base), all: tagArr(n.all) },
    rating: num(r.rating, 0, 5, true) || 0,
    longevity: pick(r.longevity, STRENGTH),
    sillage: pick(r.sillage, STRENGTH),
    memo: str(r.memo, 3000),
    targetPrice: num(r.targetPrice, 0, 100000000),
    triedAt: str(r.triedAt, 120),
    levelDate: isDate(r.levelDate) ? r.levelDate : "",
    tags: tagArr(r.tags).slice(0, 20),
    trials: Array.isArray(r.trials) ? r.trials.filter(t => t && typeof t === "object" && !Array.isArray(t)).slice(0, 50).map(normalizeTrial) : [],
    hasPhoto: r.hasPhoto === true
  };
  if(it.updated < it.created) it.updated = it.created;
  return it;
}
function todayStr(){ return ymd(new Date()); }
function normalizeWear(raw){
  const r = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
  const now = Date.now();
  const w = {
    id: typeof r.id === "string" && r.id && r.id.length <= 64 ? r.id : uid(),
    itemId: typeof r.itemId === "string" ? r.itemId.slice(0, 64) : "",
    date: isDate(r.date) ? r.date : todayStr(),
    occasion: pick(r.occasion, OCCASIONS),
    sprays: num(r.sprays, 1, 99, true),
    hours: num(r.hours, 0, 72),
    memo: str(r.memo, 1000),
    feel: pick(r.feel, FEELS),
    layerId: typeof r.layerId === "string" ? r.layerId.slice(0, 64) : "",
    created: num(r.created, 1, 9e15, true) || now,
    updated: num(r.updated, 1, 9e15, true) || now
  };
  if(w.updated < w.created) w.updated = w.created;
  return w;
}
function normalizeMonths(m){ return Array.isArray(m) && m.length === 12 && m.every(x => keysOf(SEASONS).includes(x)) ? m.slice() : DEFAULT_MONTHS.slice(); }
function normalizeSettings(s){
  s = s && typeof s === "object" && !Array.isArray(s) ? s : {};
  return { lastBackup: num(s.lastBackup, 0, 9e15, true) || 0, seasonMonths: normalizeMonths(s.seasonMonths),
    mlPerSpray: num(s.mlPerSpray, 0.01, 1) || 0.1, defaultSprays: num(s.defaultSprays, 1, 30, true) || 3, idleDays: num(s.idleDays, 7, 3650, true) || 60 };
}
function normalizeTrial(r){
  return { id: typeof r.id === "string" && r.id && r.id.length <= 64 ? r.id : uid(), date: isDate(r.date) ? r.date : todayStr(), place: str(r.place, 120), feel: pick(r.feel, FEELS), price: num(r.price, 0, 100000000), memo: str(r.memo, 1000) };
}
function freshData(){ return { schema: SCHEMA, items: [], wears: [], settings: normalizeSettings({}) }; }
function migrate(d){
  if(!d || typeof d !== "object" || Array.isArray(d)) throw new Error("bad data");
  const schema = typeof d.schema === "number" ? d.schema : 1;
  if(schema > SCHEMA) return { newer: true };
  const items = Array.isArray(d.items) ? d.items.filter(x => x && typeof x === "object" && !Array.isArray(x)).map(normalizeItem) : [];
  // schema 1 → 2：新增 wears（穿香日誌）與 settings.seasonMonths
  const ids = new Set(items.map(x => x.id));
  const wears = schema >= 2 && Array.isArray(d.wears) ? d.wears.filter(x => x && typeof x === "object" && !Array.isArray(x)).map(normalizeWear).filter(w => ids.has(w.itemId)) : [];
  if(schema < 3) upgradeLevels(items);
  return { data: { schema: SCHEMA, items, wears, settings: normalizeSettings(d.settings) } };
}
// schema 2 → 3：舊的手動剩餘量沒有記錄日期，用最後修改日當起算點，避免把以前的噴量重複扣
function upgradeLevels(items){ items.forEach(it => { if(it.level && !it.levelDate) it.levelDate = ymd(new Date(it.updated)); }); }
function remainInfo(it, wears, st){
  if(!(it.status === "own" || it.status === "decant") || !(it.volume > 0)) return null;
  const since = it.level ? it.levelDate : "";
  const base = it.level ? it.volume * LEVEL_PCT[it.level] : it.volume;
  let sprays = 0;
  wears.forEach(w => { if(w.itemId === it.id && (!since || w.date > since)) sprays += w.sprays != null ? w.sprays : st.defaultSprays; });
  const remain = Math.max(0, base - sprays * st.mlPerSpray);
  return { remain: Math.round(remain * 10) / 10, pct: remain / it.volume, times: Math.floor(remain / (st.defaultSprays * st.mlPerSpray) + 1e-9), low: it.level === "low" || remain / it.volume < 0.1 };
}
function idleDaysOf(it, wi, today){
  if(!(it.status === "own" || it.status === "decant")) return null;
  const w = wi.get(it.id), from = (w && w.last) || it.buyDate || ymd(new Date(it.created));
  return Math.max(0, daysBetween(from, today));
}
function canShareFiles(){

}
function seasonOf(date, months){ const m = parseInt(String(date).slice(5, 7), 10); return (months || DEFAULT_MONTHS)[(m >= 1 && m <= 12 ? m : 1) - 1]; }
function wearIndex(wears){
  const m = new Map();
  wears.forEach(w => { const e = m.get(w.itemId); if(e){ e.count++; if(w.date > e.last) e.last = w.date; } else m.set(w.itemId, { count: 1, last: w.date }); });
  return m;
}
function daysBetween(a, b){ return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function agoText(date, today){ if(!date) return "還沒噴過"; const d = daysBetween(date, today); return d <= 0 ? "今天" : d === 1 ? "昨天" : d + " 天前"; }
function dateLabel(date){ const d = new Date(date + "T00:00:00"); return `${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）`; }
function sortWears(wears){ return wears.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0) || (b.created - a.created)); }
function allNotes(it){ return [...it.notes.top, ...it.notes.mid, ...it.notes.base, ...it.notes.all]; }

/* ===== 儲存（所有瀏覽器儲存的讀寫只在這裡） ===== */
const store = {
  KEY: "perfume-log-data", THEME: "perfume-log-theme", BAD: "perfume-log-data-bad",
  load(){
    let raw = null;
    try{ raw = localStorage.getItem(this.KEY); }catch(e){ return { data: freshData(), error: "unavailable" }; }
    if(!raw) return { data: freshData() };
    try{
      const m = migrate(JSON.parse(raw));
      if(m.newer) return { data: freshData(), error: "newer" };
      return { data: m.data };
    }catch(e){
      try{ if(!localStorage.getItem(this.BAD)) localStorage.setItem(this.BAD, raw); }catch(_){}
      return { data: freshData(), error: "corrupt" };
    }
  },
  save(data){ try{ localStorage.setItem(this.KEY, JSON.stringify(data)); return true; }catch(e){ return false; } },
  getTheme(){ try{ const v = localStorage.getItem(this.THEME); return ["light","dark"].includes(v) ? v : "auto"; }catch(e){ return "auto"; } },
  setTheme(v){ try{ localStorage.setItem(this.THEME, v); }catch(e){} },
  _dbp: null,
  db(){
    if(this._dbp) return this._dbp;
    this._dbp = new Promise((res, rej) => {
      try{
        if(typeof indexedDB === "undefined") throw new Error("no indexedDB");
        const r = indexedDB.open("perfume-log", 1);
        r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains("photos")) r.result.createObjectStore("photos"); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error("blocked"));
      }catch(e){ rej(e); }
    });
    this._dbp.catch(() => { this._dbp = null; });
    return this._dbp;
  },
  _tx(mode, fn){
    return this.db().then(db => new Promise((res, rej) => {
      let out;
      try{
        const t = db.transaction("photos", mode), s = t.objectStore("photos");
        const r = fn(s);
        if(r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error || new Error("abort"));
      }catch(e){ rej(e); }
    }));
  },
  getPhoto(id){ return this._tx("readonly", s => s.get(id)); },
  putPhoto(id, blob){ return this._tx("readwrite", s => s.put(blob, id)); },
  delPhoto(id){ return this._tx("readwrite", s => s.delete(id)); },
  photoKeys(){ return this._tx("readonly", s => s.getAllKeys()); },
  async exportAll(data, withPhotos){
    const out = { app: "perfume-log", schema: SCHEMA, version: APP_VERSION, exported: new Date().toISOString(), items: data.items, wears: data.wears, settings: data.settings };
    let missing = 0;
    if(withPhotos){
      out.photos = {};
      for(const it of data.items){
        if(!it.hasPhoto) continue;
        try{ const b = await this.getPhoto(it.id); if(b) out.photos[it.id] = await blobToDataURL(b); else missing++; }catch(e){ missing++; }
      }
    }
    return { out, missing };
  },
  importAll(text){ return validateImport(text); }
};
function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
function dataURLtoBlob(u){
  const i = u.indexOf(","), head = u.slice(0, i), body = u.slice(i + 1);
  const mime = (head.match(/^data:([^;,]+)/) || [])[1] || "image/jpeg";
  const bin = atob(body), arr = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], { type: mime });
}

/* ===== 匯入驗證與合併（純函式） ===== */
function validateImport(text){
  let o;
  try{ o = JSON.parse(String(text).replace(/^﻿/, "")); }catch(e){ return { error: "這不是有效的備份檔（JSON 格式錯誤），現有資料沒有變動。" }; }
  let arr;
  if(Array.isArray(o)) arr = o;
  else if(o && typeof o === "object"){
    if(o.app && o.app !== "perfume-log") return { error: "這個檔案不是香水紀錄的備份，現有資料沒有變動。" };
    if(typeof o.schema === "number" && o.schema > SCHEMA) return { error: "這個備份來自較新版本的 app，請重新整理更新 app 後再匯入。" };
    arr = o.items;
  }
  if(!Array.isArray(arr)) return { error: "檔案裡找不到香水資料，現有資料沒有變動。" };
  const items = [], seen = new Set();
  let skipped = 0;
  arr.forEach(r => {
    if(!r || typeof r !== "object" || Array.isArray(r)){ skipped++; return; }
    const it = normalizeItem(r);
    if(!it.brand || !it.name){ skipped++; return; }
    const hadId = typeof r.id === "string" && r.id && r.id.length <= 64;
    if(seen.has(it.id)) it.id = uid();
    seen.add(it.id);
    if(!hadId) it._new = true;
    items.push(it);
  });
  if(!(o && !Array.isArray(o) && typeof o.schema === "number" && o.schema >= 3)) upgradeLevels(items);
  if(!items.length) return { error: skipped ? `檔案裡的 ${skipped} 筆資料都缺少品牌或名稱，無法匯入。現有資料沒有變動。` : "檔案裡沒有香水資料，現有資料沒有變動。" };
  const ph = o && !Array.isArray(o) && o.photos && typeof o.photos === "object" ? o.photos : {};
  const photos = {};
  items.forEach(it => { const p = ph[it.id]; if(typeof p === "string" && /^data:image\/(jpeg|png|webp|gif);base64,/.test(p)) photos[it.id] = p; });
  const ex = o && !Array.isArray(o) && typeof o.exported === "string" && !isNaN(Date.parse(o.exported)) ? ymd(new Date(o.exported)) : "";
  const ids = new Set(items.map(x => x.id)), wseen = new Set();
  const wears = (o && !Array.isArray(o) && Array.isArray(o.wears) ? o.wears : [])
    .filter(w => w && typeof w === "object" && !Array.isArray(w)).map(normalizeWear)
    .filter(w => ids.has(w.itemId) && !wseen.has(w.id) && wseen.add(w.id));
  const settings = o && !Array.isArray(o) && o.settings && typeof o.settings === "object" ? normalizeSettings(o.settings) : null;
  return { items, wears, settings, photos, photoCount: Object.keys(photos).length, skipped, exported: ex };
}

function heatData(wears, today, weeks){
  const end = new Date(today + "T00:00:00"), start = new Date(end);
  start.setDate(start.getDate() - end.getDay() - (weeks - 1) * 7);
  const cnt = new Map(); wears.forEach(w => cnt.set(w.date, (cnt.get(w.date) || 0) + 1));
  const cells = [];
  let days = 0, total = 0, run = 0, best = 0;
  for(const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)){
    const k = ymd(d), n = cnt.get(k) || 0;
    cells.push({ date: k, n });
    if(n){ days++; total += n; run++; if(run > best) best = run; } else run = 0;
  }
  return { cells, days, total, best, current: run, start: ymd(start) };
}

function afterRender(){

function updateList(){ const el = $("#list"); if(el){ el.innerHTML = renderList(); hydratePhotos(); } }
function hydratePhotos(){
  if(io){ io.disconnect(); }
  const imgs = document.querySelectorAll("img[data-photo]:not([src])");
  if(!imgs.length) return;
  if(typeof IntersectionObserver !== "undefined"){
    if(!io) io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ io.unobserve(e.target); loadImg(e.target); } }), { rootMargin: "400px" });
    imgs.forEach(i => io.observe(i));
  } else imgs.forEach(loadImg);
}
async function loadImg(img){
  const id = img.dataset.photo;
  let u = photoURLs.get(id);
  if(!u){
    try{
      const b = await store.getPhoto(id);
      if(!b) return;
      u = URL.createObjectURL(b); photoURLs.set(id, u);
    }catch(e){ return; }
  }
  if(img.isConnected) img.src = u;
}
function dropPhotoURL(id){ const u = photoURLs.get(id); if(u){ URL.revokeObjectURL(u); photoURLs.delete(id); } }
function toast(msg, o){

  t.innerHTML = esc(msg) + (o.undo ? `・<button type="button" class="linkbtn" data-act="undo">復原</button>` : "") +
    (o.action ? `・<button type="button" class="linkbtn" data-act="${esc(o.action[1])}" data-id="${esc(o.action[2] || "")}">${esc(o.action[0])}</button>` : "");

}

function finalizePendingDelete(){

}
function deleteItem(id){

function undoDelete(){

}
function addWear(itemId){

}

async function handlePhoto(file){
  if(!file || !UI.draft) return;
  if(file.type && !/^image\//.test(file.type)){ toast("請選擇圖片檔"); return; }
  toast("照片處理中…");
  try{
    const blob = await compressImage(file);
    if(!UI.draft) return;
    if(UI.draftURL) URL.revokeObjectURL(UI.draftURL);
    UI.draft._photoBlob = blob; UI.draft._photoRemove = false; UI.draftURL = URL.createObjectURL(blob);
    render(); toast("已加入照片，按儲存後生效");
  }catch(e){ toast("無法讀取這張照片，請換一張試試", { ms: 4000 }); }
}
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if(!w0 || !h0) throw new Error("size");
    const s = Math.min(1, 800 / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "white"; /* 透明背景轉 JPEG 用，非介面色 */
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", 0.8));
  } finally { URL.revokeObjectURL(url); }
}

  UI.pasteText = ""; UI.formErr = false; UI.open.paste = true;
  render(); toast("已帶入，存檔前可以再修改");
}
async function copyText(t){

  try{ const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; }catch(e){ return false; }
}
function download(blob, name){

  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000);

async function exportBackup(forceDownload){

  try{
    const { out, missing } = await store.exportAll(S, UI.expPhotos);
    const name = `perfume-log-backup-${ymd(new Date()).replace(/-/g, "")}.json`;
    const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
    let how = "download";
    if(!forceDownload && canShareFiles()){
      try{
        const file = new File([blob], name, { type: "application/json" });
        if(navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: "香水紀錄備份" }); how = "share"; }
      }catch(e){ how = e && e.name === "AbortError" ? "cancel" : "download"; }
    }
    if(how === "cancel"){ toast("已取消分享，沒有備份"); }
    else {
      if(how === "download") download(blob, name);
      persist({ ...S, settings: { ...S.settings, lastBackup: Date.now() } });
      const pc = out.photos ? Object.keys(out.photos).length : 0;
      toast(`${how === "share" ? "已分享" : "已下載"}備份：${out.items.length} 款${UI.expPhotos ? `（含 ${pc} 張照片）` : ""}${missing ? `，${missing} 張照片讀取失敗` : ""}`, { ms: 4000 });
    }

async function handleImportFile(file){
  UI.imp = null; UI.impConfirm = false;
  if(!file) return;
  if(file.size > 300 * 1024 * 1024){ UI.imp = { error: "檔案太大，無法匯入。" }; render(); return; }
  let text;
  try{ text = await file.text(); }catch(e){ UI.imp = { error: "無法讀取檔案。" }; render(); return; }
  UI.imp = store.importAll(text); render();
}
async function doImport(mode){
  const imp = UI.imp; if(!imp || imp.error || UI.busy) return;
  if(UI.readOnly){ toast("目前暫停存檔，請重新整理頁面", { ms: 4000 }); return; }
  finalizePendingDelete();
  UI.busy = true; render();
  const old = new Map(S.items.map(x => [x.id, x]));
  let next, written, msg;
  if(mode === "merge"){
    const r = mergeItems(S.items, imp.items);
    next = r.items; written = r.written;
    msg = `已合併：新增 ${r.added}、更新 ${r.updated}` + (r.same ? `、未變 ${r.same}` : "") + (r.dup ? `、重複略過 ${r.dup}` : "");
  } else {
    next = imp.items.map(cloneItem); written = new Set(next.map(x => x.id));
    msg = `已取代：共 ${next.length} 款`;
  }
  let fail = 0;
  for(const it of next){
    if(!written.has(it.id)) continue;
    const prev = old.get(it.id), p = imp.photos[it.id];
    if(p){
      try{ await store.putPhoto(it.id, dataURLtoBlob(p)); it.hasPhoto = true; dropPhotoURL(it.id); }
      catch(e){ fail++; it.hasPhoto = !!(prev && prev.hasPhoto); }
    } else it.hasPhoto = !!(prev && prev.hasPhoto);
  }
  const ids = new Set(next.map(x => x.id));
  let wears, settings = S.settings;
  if(mode === "merge"){ const mw = mergeWears(S.wears, imp.wears || [], ids); wears = mw.wears; if(mw.added) msg += `；日誌新增 ${mw.added} 筆`; }
  else { wears = (imp.wears || []).filter(w => ids.has(w.itemId)).map(w => ({ ...w })); if(imp.settings) settings = { ...S.settings, seasonMonths: imp.settings.seasonMonths }; }
  UI.busy = false;
  if(!persist({ ...S, items: next, wears, settings })){ render(); return; }
  if(mode === "replace"){
    const keep = new Set(next.filter(x => x.hasPhoto).map(x => x.id));
    old.forEach((x, id) => { if(x.hasPhoto && !keep.has(id)){ store.delPhoto(id).catch(() => {}); dropPhotoURL(id); } });
  }
  UI.imp = null; UI.impConfirm = false;
  render(); toast(msg + (fail ? `；${fail} 張照片寫入失敗` : ""), { ms: 5000 });
}

    (keys || []).forEach(k => { if(!ok.has(k)) store.delPhoto(k).catch(() => {}); });
  }catch(e){}
}

function onClick(e){
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  switch(act){
    case "tab": {
      const t = b.dataset.tab;
      if(UI.tab === t && UI.view === "list") return;
      if(UI.view !== "list"){ if(!confirmLeave()) return; closeForm(); }
      UI.tab = t; render(); window.scrollTo(0, 0); break;
    }
    case "add": openForm(null); break;
    case "edit": if(UI.view !== "list" && !confirmLeave()) return; closeForm(); openForm(b.dataset.id); break;
    case "cancel": if(confirmLeave()) backToList(); break;
    case "save": saveDraft(); break;
    case "del": if(UI.draft) deleteItem(UI.draft.id); break;
    case "undo": { const f = UI.undoFn; hideToast(); if(f) f(); break; }
    case "wear": addWear(b.dataset.id); break;
    case "wear-new": if(confirmLeave()) openWear(null); break;
    case "wear-edit": if(UI.view === "list" || confirmLeave()){ if(UI.tab !== "log"){ UI.tab = "log"; } openWear(b.dataset.id); } break;
    case "wear-save": saveWear(); break;
    case "wear-del": deleteWear(); break;
    case "goto-log": hideToast(); if(UI.view === "list" || confirmLeave()){ closeForm(); UI.tab = "log"; render(); window.scrollTo(0, 0); } break;
    case "log-more": UI.logLimit += 200; render(); break;
    case "log-view": UI.logView = v; render(); break;
    case "cal-prev": case "cal-next": UI.calMonth = shiftMonth(UI.calMonth || todayStr().slice(0, 7), act === "cal-prev" ? -1 : 1); UI.calDay = ""; render(); break;
    case "cal-today": UI.calMonth = ""; UI.calDay = ""; render(); break;
    case "cal-day": UI.calDay = v; render(); break;
    case "wear-new-day": if(confirmLeave()) openWear(null, "", v); break;
    case "goto-day": UI.tab = "log"; UI.logView = "cal"; UI.calMonth = v.slice(0, 7); UI.calDay = v; render(); window.scrollTo(0, 0); break;
    case "stat-period": UI.statPeriod = v; render(); break;
    case "stat-all": UI.statAll = !UI.statAll; render(); break;
    case "pick-season": UI.pickSeason = v; UI.pickOffset = 0; render(); break;
    case "pick-time": UI.pickTime = v; UI.pickOffset = 0; render(); break;
    case "pick-more": UI.pickOffset += 3; render(); break;
    case "months-reset": { const settings = { ...S.settings, seasonMonths: DEFAULT_MONTHS.slice() }; if(persist({ ...S, settings })){ render(); toast("已恢復預設季節"); } break; }
    case "fstatus": UI.f.status = v; render(); break;
    case "ffam": toggleArr(UI.f.fams, v); render(); break;
    case "fseason": toggleArr(UI.f.seasons, v); render(); break;
    case "fclear": UI.f = emptyFilter(); render(); break;
    case "fidle": UI.f.idle = !UI.f.idle; render(); break;
    case "ftag": toggleArr(UI.f.tags, v); render(); break;
    case "goto-settings": if(UI.view !== "list" && !confirmLeave()) return; closeForm(); UI.tab = "settings"; render(); window.scrollTo(0, 0); break;
    case "dtoggle": {
      const d = UI.draft, f = b.dataset.f; if(!d || !Array.isArray(d[f])) return;
      if(f === "families" && !d[f].includes(v) && d[f].length >= 2){ toast("香調家族最多選 2 個"); return; }
      toggleArr(d[f], v); b.setAttribute("aria-pressed", String(d[f].includes(v))); break;
    }
    case "star": if(UI.draft){ const n = Number(v) || 0; UI.draft.rating = UI.draft.rating === n ? 0 : n; render(); } break;
    case "addtag": addTag(b.dataset.layer); break;
    case "rmtag": if(UI.draft){ UI.draft.notes[b.dataset.layer].splice(Number(b.dataset.i), 1); render(); } break;
    case "photo-rm": if(UI.draft){ if(UI.draftURL){ URL.revokeObjectURL(UI.draftURL); UI.draftURL = ""; } UI.draft._photoBlob = null; UI.draft._photoRemove = UI.draft.hasPhoto; render(); } break;
    case "paste": applyPaste(); break;
    case "copytpl": copyText(TPL).then(ok => toast(ok ? "已複製查詢範本" : "複製失敗，請長按範本文字選取")); break;
    case "export": exportBackup(false); break;
    case "export-dl": exportBackup(true); break;
    case "pick-occ": UI.pickOcc = v; UI.pickOffset = 0; render(); break;
    case "imp-merge": doImport("merge"); break;
    case "imp-replace": UI.impConfirm = true; render(); break;
    case "imp-replace-ok": doImport("replace"); break;
    case "imp-cancel": UI.imp = null; UI.impConfirm = false; render(); break;
  }
}
function onInput(e){
  const t = e.target;
  if(t.id === "q"){ UI.f.q = t.value; updateList(); return; }
  if(t.id === "paste"){ UI.pasteText = t.value; return; }
  if(t.dataset.tagin){
    const layer = t.dataset.tagin;
    UI.tagIn[layer] = t.value;
    if(!e.isComposing && /[,，、;；]/.test(t.value)){
      const parts = t.value.split(/[,，、;；]/), rest = parts.pop();
      UI.tagIn[layer] = rest;
      if(UI.draft) UI.draft.notes[layer] = tagArr(UI.draft.notes[layer].concat(parts.map(s => s.trim()).filter(Boolean)));
      UI.focus = `[data-tagin="${layer}"]`; render();
    }
    return;
  }
  if(t.dataset.w && UI.wdraft && t.type !== "radio" && t.tagName !== "SELECT"){ UI.wdraft[t.dataset.w] = t.value; if(t.dataset.w === "date"){ const el = $(".wseason"); if(el) el.textContent = isDate(t.value) ? label(SEASONS, seasonOf(t.value, S.settings.seasonMonths)) + "（依日期自動判斷）" : "—"; } return; }
  if(t.dataset.f && UI.draft && t.type !== "radio"){ UI.draft[t.dataset.f] = t.value; if(UI.formErr && t.classList.contains("err") && t.value.trim()) t.classList.remove("err"); }
}
function onChange(e){
  const t = e.target;
  if(t.id === "cal-item"){ if(UI.calItem === t.value) return; UI.calItem = t.value; render(); return; }
  if(t.id === "sort"){ if(UI.sort === t.value) return; UI.sort = t.value; updateList(); return; }
  if(t.dataset.file === "photo"){ const f = t.files && t.files[0]; t.value = ""; handlePhoto(f); return; }
  if(t.dataset.file === "import"){ const f = t.files && t.files[0]; t.value = ""; handleImportFile(f); return; }
  if(t.dataset.set === "theme"){ if(UI.theme === t.value) return; UI.theme = t.value; store.setTheme(t.value); applyTheme(t.value); return; }
  if(t.dataset.set === "expPhotos"){ UI.expPhotos = t.checked; return; }
  if(t.dataset.set === "layered" && UI.draft){
    const d = UI.draft, layered = !t.checked;
    if(d.notesLayered === layered) return;
    d.notesLayered = layered;
    if(!layered && !d.notes.all.length) d.notes.all = tagArr([...d.notes.top, ...d.notes.mid, ...d.notes.base]);
    if(layered && !d.notes.top.length && !d.notes.mid.length && !d.notes.base.length) d.notes.mid = d.notes.all.slice();
    render(); return;
  }
  if(t.dataset.setnum){
    const k = t.dataset.setnum, next = normalizeSettings({ ...S.settings, [k]: t.value });
    if(next[k] === S.settings[k]){ t.value = S.settings[k]; return; }
    if(persist({ ...S, settings: next })){ t.value = next[k]; toast("已更新設定"); }
    return;
  }
  if(t.dataset.month != null){
    const i = Number(t.dataset.month), months = S.settings.seasonMonths.slice();
    if(months[i] === t.value) return;
    months[i] = t.value;
    if(persist({ ...S, settings: { ...S.settings, seasonMonths: months } })) toast(`${i + 1} 月改為${label(SEASONS, t.value)}`);
    return;
  }
  if(t.dataset.w && UI.wdraft && (t.type === "radio" || t.tagName === "SELECT")){ if(UI.wdraft[t.dataset.w] === t.value) return; UI.wdraft[t.dataset.w] = t.value; if(t.dataset.w === "itemId"){ UI.wErr = false; t.classList.remove("err"); } return; }
  if(t.type === "radio" && t.dataset.f && UI.draft){ if(UI.draft[t.dataset.f] === t.value) return; const was = UI.draft[t.dataset.f]; UI.draft[t.dataset.f] = t.value;
    if(t.dataset.f === "level") UI.draft.levelDate = t.value ? todayStr() : ""; if(t.dataset.f === "status" && (was === "want" || t.value === "want")){ const y = window.scrollY; render(); window.scrollTo(0, y); } }
}
function onKey(e){
  const t = e.target;
  if(e.key === "Enter" && t.dataset && t.dataset.tagin){
    if(e.isComposing || e.keyCode === 229) return;
    e.preventDefault(); addTag(t.dataset.tagin);
  }
}
function onToggle(e){ const t = e.target; if(t && t.dataset && t.dataset.open) UI.open[t.dataset.open] = t.open; }

function init(){
  const r = store.load();
  S = r.data; UI.loadError = r.error || ""; UI.readOnly = r.error === "newer";
  UI.theme = store.getTheme(); applyTheme(UI.theme);
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", onKey);
  document.addEventListener("toggle", onToggle, true);
  render();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
  if(!UI.loadError && S.items.length) cleanupPhotos();
}
if(typeof document !== "undefined") init();
</script>
</body>
</html>
